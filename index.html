<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt-to-GDP Ratio Calculator</title>
    <style>
        /* Strict Notion Monotone Dark Theme */
        :root {
            --bg-color: #191919;                  /* Notion Dark Page BG */
            --card-bg: #222222;                /* Notion Dark Block/Card BG */
            --text-main: rgba(255, 255, 255, 0.9);/* Notion Primary White Text */
            --text-muted: rgba(255, 255, 255, 0.45);/* Notion Muted Subtext */
            --border-color: rgba(255, 255, 255, 0.1);/* Notion Subtle Border */
            --border-hover: rgba(255, 255, 255, 0.25);
            --input-bg: #191919;               /* Match Notion Input BG */
            --badge-bg: rgba(255, 255, 255, 0.08); /* Neutral Tag BG */
            --badge-text: rgba(255, 255, 255, 0.85);
        }

        /* Remove default browser accent blue colors */
        * {
            accent-color: var(--text-main);
            box-sizing: border-box;
        }

        ::selection {
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 1.75rem;
            border-radius: 6px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1.25rem;
            text-align: center;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .input-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease;
        }

        /* Replaces standard browser blue outline with neutral white border */
        input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 1px var(--border-hover);
        }

        /* Chrome/Safari number input arrows styling */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            opacity: 0.4;
            filter: invert(1);
        }

        .results {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .ratio-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0.2rem 0;
            letter-spacing: -0.02em;
        }

        .status {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: 0.4rem;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Debt-to-GDP Calculator</h1>
        <div class="input-group">
            <label for="totalDebt">Total National Debt ($)</label>
            <input type="number" id="totalDebt" value="34000000000000" placeholder="e.g. 34000000000000">
        </div>
        <div class="input-group">
            <label for="grossGDP">Gross Domestic Product (GDP) ($)</label>
            <input type="number" id="grossGDP" value="27000000000000" placeholder="e.g. 27000000000000">
        </div>
        <div class="results">
            <label>Calculated Debt-to-GDP Ratio</label>
            <div id="ratioOutput" class="ratio-value">0%</div>
            <div id="statusOutput" class="status">--</div>
        </div>
    </div>

    <script>
        function updateUI() {
            const debtInput = document.getElementById('totalDebt');
            const gdpInput = document.getElementById('grossGDP');
            const ratioOutput = document.getElementById('ratioOutput');
            const statusOutput = document.getElementById('statusOutput');

            if (!debtInput || !gdpInput || !ratioOutput || !statusOutput) return;

            const debt = parseFloat(debtInput.value) || 0;
            const gdp = parseFloat(gdpInput.value) || 0;

            if (gdp <= 0) {
                ratioOutput.textContent = 'N/A';
                statusOutput.textContent = 'Invalid GDP value';
                return;
            }

            const ratio = (debt / gdp) * 100;
            ratioOutput.textContent = ratio.toFixed(1) + '%';

            if (ratio > 100) {
                statusOutput.textContent = 'High Risk (>100%)';
            } else if (ratio > 60) {
                statusOutput.textContent = 'Moderate Risk (60–100%)';
            } else {
                statusOutput.textContent = 'Low Risk (<60%)';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const debtInput = document.getElementById('totalDebt');
            const gdpInput = document.getElementById('grossGDP');

            debtInput.addEventListener('input', updateUI);
            gdpInput.addEventListener('input', updateUI);

            updateUI();
        });
    </script>
</body>
</html>
