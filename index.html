Here is the complete, standalone HTML file with the JavaScript error fixed by wrapping the script execution in a `DOMContentLoaded` event listener:

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt-to-GDP Ratio Calculator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--accent-color);
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-color);
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .results {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .ratio-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 0.5rem 0;
    }

    .status {
      font-size: 0.9rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      display: inline-block;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Debt-to-GDP Calculator</h1>

    <div class="input-group">
      <label for="totalDebt">Total National Debt ($)</label>
      <input type="number" id="totalDebt" value="34000000000000" placeholder="e.g. 34000000000000">
    </div>

    <div class="input-group">
      <label for="grossGDP">Gross Domestic Product (GDP) ($)</label>
      <input type="number" id="grossGDP" value="27000000000000" placeholder="e.g. 27000000000000">
    </div>

    <div class="results">
      <label>Calculated Debt-to-GDP Ratio</label>
      <div id="ratioOutput" class="ratio-value">0%</div>
      <div id="statusOutput" class="status">--</div>
    </div>
  </div>

  <script>
    function updateUI() {
      const debtInput = document.getElementById('totalDebt');
      const gdpInput = document.getElementById('grossGDP');
      const ratioOutput = document.getElementById('ratioOutput');
      const statusOutput = document.getElementById('statusOutput');

      if (!debtInput || !gdpInput || !ratioOutput || !statusOutput) return;

      const debt = parseFloat(debtInput.value) || 0;
      const gdp = parseFloat(gdpInput.value) || 0;

      if (gdp <= 0) {
        ratioOutput.textContent = 'N/A';
        statusOutput.textContent = 'Invalid GDP value';
        statusOutput.style.backgroundColor = 'transparent';
        statusOutput.style.color = '#ef4444';
        return;
      }

      const ratio = (debt / gdp) * 100;
      ratioOutput.textContent = ratio.toFixed(1) + '%';

      if (ratio > 100) {
        statusOutput.textContent = 'High Risk';
        statusOutput.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
        statusOutput.style.color = '#ef4444';
      } else if (ratio > 60) {
        statusOutput.textContent = 'Moderate Risk';
        statusOutput.style.backgroundColor = 'rgba(245, 158, 11, 0.2)';
        statusOutput.style.color = '#f59e0b';
      } else {
        statusOutput.textContent = 'Low Risk';
        statusOutput.style.backgroundColor = 'rgba(34, 197, 94, 0.2)';
        statusOutput.style.color = '#22c55e';
      }
    }

    // Safely execute DOM manipulations after the HTML is fully parsed
    document.addEventListener('DOMContentLoaded', () => {
      const debtInput = document.getElementById('totalDebt');
      const gdpInput = document.getElementById('grossGDP');

      debtInput.addEventListener('input', updateUI);
      gdpInput.addEventListener('input', updateUI);

      // Initial calculation call
      updateUI();
    });
  </script>
</body>
</html>
